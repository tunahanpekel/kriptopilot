name: kriptopilot
description: "KriptoPilot — AI-powered personal crypto trading bot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # HTTP / Binance API
  http: ^1.2.1

  # Crypto / HMAC-SHA256 for Binance API signing
  crypto: ^3.0.3

  # Secure storage for Binance API keys
  flutter_secure_storage: ^10.0.0

  # Charts for Analytics
  fl_chart: ^0.68.0

  # Storage
  shared_preferences: ^2.5.5

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Utils
  intl: "0.20.2"
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.10
  json_serializable: ^6.13.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash.png
